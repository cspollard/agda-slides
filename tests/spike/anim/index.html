<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><title>animation spike</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reset.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/theme/white.css" />
<link rel="stylesheet" href="anim.css" />
</head><body><div class="reveal"><div class="slides">

<!-- 1. flipbook: three frames in one svg, one shown at a time -->
<section id="flip"><h2>flipbook</h2>
<svg class="anim" data-step="0" viewBox="0 0 400 160" width="800">
  <g class="frame" data-f="0"><rect x="10" y="10" width="60" height="40" fill="#69c" /></g>
  <g class="frame" data-f="1"><rect x="110" y="10" width="60" height="40" fill="#69c" /></g>
  <g class="frame" data-f="2"><rect x="110" y="90" width="60" height="40" fill="#69c" /><circle cx="300" cy="110" r="20" fill="#c96" /></g>
</svg>
<span class="fragment marker" data-fragment-index="1"></span>
<span class="fragment marker" data-fragment-index="2"></span>
</section>

<!-- 2. tracks: elements emitted once, per-step CSS state with transitions -->
<section id="tracks"><h2>tracks</h2>
<svg class="anim" data-step="0" viewBox="0 0 400 160" width="800">
  <rect id="a" x="10" y="10" width="60" height="40" fill="#69c" />
  <circle id="b" cx="300" cy="110" r="20" fill="#c96" />
  <text id="t" x="200" y="150" font-size="16">label</text>
</svg>
<span class="fragment marker" data-fragment-index="1"></span>
<span class="fragment marker" data-fragment-index="2"></span>
</section>

</div></div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"></script>
<script src="anim.js"></script>
<script>Reveal.initialize({hash: false, transition: 'none', width: 960, height: 540});</script>
</body></html>
